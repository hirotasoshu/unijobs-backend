[tool.poetry]
name = "unijobs-backend"
package-mode = false
version = "0.1.0"
description = ""
authors = ["Maksim Zayakin <rasetsuq@yandex.ru>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116.1"
dishka = "^1.7.1"
sqlalchemy = {extras = ["aiosqlite"], version = "^2.0.43"}
ydb = "^3.21.0"
ydb-sqlalchemy = "^0.1.9"
fastapi-problem-details = "^0.1.4"
uvicorn = "^0.35.0"
alembic = "^1.18.4"


[tool.poetry.group.dev.dependencies]
ruff = "^0.13.0"
mypy = "^1.18.1"
pytest = "^9.0.3"
httpx = "^0.28.1"
pytest-asyncio = "^1.4.0"
testcontainers = "^4.14.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
    "unit: fast isolated tests",
    "integration: tests that exercise app wiring or external adapters",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
