services:
  ydb:
    image: ydbplatform/local-ydb:latest
    ports:
      - "2136:2136"
      - "8765:8765"

  backend:
    build: .
    depends_on:
      - ydb
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      DATABASE_BACKEND: ydb
      YDB_ENDPOINT: grpc://ydb:2136/local
      YDB_AUTH_MODE: anonymous
      YDB_DISABLE_DISCOVERY: "1"
      AUTH_JWT_SECRET: local-dev-secret-change-me
      AUTH_ACCESS_TOKEN_TTL_SECONDS: "3600"
      AUTH_JWT_ISSUER: unijobs-local
      CORS_ALLOW_ORIGINS: "*"
    command: sh scripts/local-start.sh
